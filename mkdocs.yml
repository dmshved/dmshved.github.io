site_name: Dmytro Shved

site_url: https://dmytroshved.com
markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - attr_list
    - md_in_html
    - pymdownx.blocks.caption
    - toc:
        permalink: "#"
plugins:
  - rss:
      match_path: blog/posts/.* 
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
  - blog
  - search
  - social:
      cards_layout: default
      cards_layout_options:
        background_color: "#000000"
        title: Dmytro Shved
        description: Backend Developer
      logo: assets/logo.jpg
extra_css:
  - stylesheets/extra.css
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.jpg
  favicon: images/favicon.ico
  features:
    - navigation.tabs
    - content.code.copy
  palette:
    # Palette toggle for dark mode
    - scheme: slate
      primary: black
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode

    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
  # font:
  #   text: Segoe UI

nav:
  - Home:
    - index.md
  - Blog:
    - blog/index.md